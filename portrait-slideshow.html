<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <title>Portrait Slideshow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'SamsungOne';
            src: url('font/SamsungOne-400.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
        
        @font-face {
            font-family: 'SamsungOne';
            src: url('font/SamsungOne-700.ttf') format('truetype');
            font-weight: 700;
            font-display: swap;
        }
        
        @font-face {
            font-family: 'SamsungSharpSans';
            src: url('font/SamsungSharpSans-Bold.ttf') format('truetype');
            font-weight: bold;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SamsungOne', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #a512ff;
            overflow: hidden;
            width: 1080px;
            height: 1920px;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(128, 57, 125, 0.9) 0%, rgba(108, 47, 105, 0.95) 50%, rgba(88, 37, 85, 0.9) 100%);
            z-index: 0;
            pointer-events: none;
        }
        
        /* Animated background particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, rgba(200, 150, 255, 0.3) 100%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        .portrait-container {
            display: flex;
            flex-direction: column;
            width: 1080px;
            height: 1920px;
            background: transparent;
            position: relative;
            z-index: 2;
        }
        
        /* Logo Section */
        .logo-section {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
        }
        
        .eco-shop-badge {
            background: linear-gradient(135deg, #80397D 0%, #A35CA0 100%);
            padding: 15px 25px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(128, 57, 125, 0.5);
        }
        
        .eco-shop-badge img {
            height: 50px;
            vertical-align: middle;
        }

        /* Photo Section - Top Half */
        .photo-section {
            width: 100%;
            height: 960px;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border-bottom: 2px solid rgba(128, 57, 125, 0.5);
        }

        .photo-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-slide.active {
            opacity: 1;
        }

        .photo-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Video Section - Bottom Half */
        .video-section {
            width: 100%;
            height: 960px;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .video-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-slide.active {
            opacity: 1;
        }

        .video-slide video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1920px;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 2000;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 24px;
            color: #fff;
        }

        /* Status Info */
        .status-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
        }

        .status-info.hidden {
            display: none;
        }

        .no-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .no-content i {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-content h3 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .no-content p {
            font-size: 18px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="loading-screen" id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Slideshow...</div>
    </div>

    <div class="portrait-container" id="portrait-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="eco-shop-badge">
                <img src="template/eco logo@3x.png" alt="Logo">
            </div>
        </div>
        <!-- Photo Section (Top) -->
        <div class="photo-section" id="photo-section">
            <div id="photo-slides-container"></div>
        </div>

        <!-- Video Section (Bottom) -->
        <div class="video-section" id="video-section">
            <div id="video-slides-container"></div>
        </div>
    </div>

    <div class="status-info hidden" id="status-info">
        <div>Photos: <span id="photo-counter">0/0</span></div>
        <div>Videos: <span id="video-counter">0/0</span></div>
    </div>

    <script>
        // Particle animation
        function createParticles() {
            const particles = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 6 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 4 + 4 + 's';
                particle.style.animationDelay = Math.random() * 3 + 's';
                particles.appendChild(particle);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
        });
    </script>
    <script src="js/portrait-slideshow.js"></script>
</body>
</html>
