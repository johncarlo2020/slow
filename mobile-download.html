<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Video</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #a512ff;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: white;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(165, 18, 255, 0.7);
            z-index: -1;
        }

        .main-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 10px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .download-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-height: 95vh;
        }
        
        .content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .video-section, .photo-section-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .video-preview {
            width: 100%;
            height: auto;
            max-height: 35vh;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .photo-preview {
            width: 100%;
            height: auto;
            max-height: 35vh;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .download-content {
            padding: 30px;
            text-align: center;
        }

        .download-btn {
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            color: white;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
            font-size: 0.9em;
            width: 100%;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
            color: white;
        }

        .loading-state {
            padding: 60px 30px;
            text-align: center;
        }

        .loader {
            width: 60px;
            height: 60px;
            margin: 0 auto 30px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-state {
            padding: 60px 30px;
            text-align: center;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="download-card">
            <!-- Loading State -->
            <div id="loading-state" class="loading-state">
                <div class="loader"></div>
                <h5 style="color: white;">Loading video...</h5>
            </div>

            <!-- Error State -->
            <div id="error-state" class="error-state" style="display: none;">
                <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                <h5>Video Not Found</h5>
                <p id="error-message">The requested video could not be found.</p>
            </div>

            <!-- Main Content -->
            <div id="main-content" style="display: none;">
                <div class="content-wrapper">
                    <!-- Video Section -->
                    <div class="video-section">
                        <video id="video-preview" class="video-preview" muted loop autoplay controls>
                            <source id="video-source" src="" type="video/mp4">
                        </video>
                        <div style="text-align: center; margin-top: 15px;">
                            <a href="#" class="download-btn" id="download-button" style="width: 100%;">
                                <i class="fas fa-download"></i> Download Video
                            </a>
                        </div>
                    </div>
                    
                    <!-- Photo Section -->
                    <div id="photo-section" class="photo-section-wrapper" style="display: none;">
                        <img id="photo-preview" class="photo-preview" src="" alt="Processed Photo">
                        <div style="text-align: center; margin-top: 15px;">
                            <a href="#" class="download-btn" id="photo-download-button" style="width: 100%;">
                                <i class="fas fa-download"></i> Download Photo
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class MobileDownload {
            constructor() {
                this.videoFilename = null;
                this.videoData = null;
                this.loadVideo();
            }

            loadVideo() {
                // Get video filename from URL parameter
                const urlParams = new URLSearchParams(window.location.search);
                this.videoFilename = urlParams.get('video');
                
                if (!this.videoFilename) {
                    // Fallback: try to get from URL path
                    const path = window.location.pathname;
                    const matches = path.match(/\/processed\/(.+)$/);
                    
                    if (matches) {
                        this.videoFilename = matches[1];
                    } else {
                        this.showError('No video specified');
                        return;
                    }
                }
                
                this.fetchVideoInfo();
            }

            async fetchVideoInfo() {
                try {
                    const response = await fetch(`api/get-video-info.php?filename=${encodeURIComponent(this.videoFilename)}`);
                    const data = await response.json();

                    if (data.success) {
                        this.videoData = data.video;
                        this.displayVideo();
                    } else {
                        throw new Error(data.message || 'Failed to load video information');
                    }
                } catch (error) {
                    console.error('Error loading video:', error);
                    this.showError('Failed to load video: ' + error.message);
                }
            }

            displayVideo() {
                // Update video preview
                const videoPreview = document.getElementById('video-preview');
                const videoSource = document.getElementById('video-source');
                
                videoSource.src = this.videoData.path;
                videoPreview.load();

                // Setup download button
                const downloadBtn = document.getElementById('download-button');
                downloadBtn.href = this.videoData.path;
                downloadBtn.download = this.videoData.filename;

                // Display photo if available
                if (this.videoData.photoPath) {
                    const photoSection = document.getElementById('photo-section');
                    const photoPreview = document.getElementById('photo-preview');
                    const photoDownloadBtn = document.getElementById('photo-download-button');
                    
                    photoPreview.src = this.videoData.photoPath;
                    photoDownloadBtn.href = this.videoData.photoPath;
                    photoDownloadBtn.download = 'photo-' + this.videoData.filename.replace('.mp4', '.png');
                    photoSection.style.display = 'block';
                }

                // Show main content
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';

                // Update page title
                document.title = 'Download Video';
            }

            showError(message) {
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('main-content').style.display = 'none';
                document.getElementById('error-message').textContent = message;
                document.getElementById('error-state').style.display = 'block';
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new MobileDownload();
        });
    </script>
</body>
</html>
